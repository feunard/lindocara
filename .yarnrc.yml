# Yarn 4, pinned by `packageManager` in package.json and installed by corepack —
# the same shape as `../alepha` and `../club`.
#
# `node-modules`, not PnP. Three of this workspace's members read the filesystem
# directly rather than through Node's resolver: `.vendor/alepha` and
# `.vendor/@alepha/*` ship raw `src` and are consumed as source (see the
# per-package tsconfig split in AGENTS.md), Vite/Rollup resolve the browser graph
# themselves, and `alepha build` packs `node_modules` for Bay. PnP would make each
# of those a separate porting job for no gain here.
nodeLinker: node-modules

# Yarn 4's own default, stated rather than inherited: no dependency gets to run
# code at install time. Nothing here needs it — esbuild and sharp both ship
# per-platform packages and resolve their binary without a postinstall — so the
# day one does, it should be an explicit `dependenciesMeta.built` and not a
# silent flip of this line.
enableScripts: false

enableTelemetry: false
