name: Deploy

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without pushing an empty commit.
  workflow_dispatch:

concurrency:
  # Never let two deploys race for the same Worker.
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Nothing reaches production without passing exactly the checks CI runs on a PR.
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    name: deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lindocara.alepha.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Alepha's SecretProvider requires this in production and throws on the dev default —
      # that's the guarantee we want. No other app secret exists: SESSION_SECRET died with the
      # legacy stack. WEBSOCKET_MAX_PAYLOAD/NAVIGATION_DEBUG/CHEATS_ENABLED are $env primitives
      # with safe defaults; add them here too only if a non-default production value is ever wanted.
      APP_SECRET: ${{ secrets.APP_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `alepha platform up` is the whole pipeline, same shape as ../alepha's own
      # `deploy-lore-production` job: provision D1, build (`--target cloudflare`), apply
      # migrations, deploy the worker + Durable Object + assets, then bulk-push the $env secrets
      # allowlisted by the manifest. Nothing here downloads CI's build artifact — this step builds
      # its own.
      - name: Deploy to Cloudflare
        run: npm run deploy -w @lindocara/main

      # « La Baie des Cent Voiles » n'a PAS d'étape ici, volontairement. Elle est publiée à la main
      # sous le compte `baieauthor`, dont le mot de passe n'est pas celui de `secrets.SEED_PASSWORD`
      # (le pas de publication échouait en 401). Deux façons de l'automatiser, au choix : aligner le
      # mot de passe de `baieauthor` sur le secret, ou supprimer d'abord l'aventure existante et
      # laisser la CI enregistrer un compte robot dédié — `--replace-if-different` ne peut pas
      # remplacer une aventure dont il n'est pas l'auteur, la suppression restant réservée à celui-ci.
