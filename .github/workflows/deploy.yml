name: Deploy

on:
  workflow_dispatch:

concurrency:
  # Never let two deploys race for the same Worker.
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Nothing reaches production without passing exactly the checks CI runs on a PR.
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    name: deploy to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lindocara.alepha.dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download checked build
        uses: actions/download-artifact@v4
        with:
          name: lindocara-build
          path: apps/main/dist

      # Schema first: code that expects a column must never reach production before the
      # column does. Migrations are additive, so this is safe to run on every deploy.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply lindocara --remote --config packages/server/wrangler.jsonc

      # Cloudflare's deployments endpoint occasionally returns a transient 522 or an internal
      # code 10013 after the upload has completed. Retry only those known transient failures;
      # real Wrangler/configuration failures remain immediately visible.
      - name: Deploy Worker (retry transient Cloudflare errors)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log=$(mktemp)
            if npx wrangler deploy --config apps/main/dist/lindocara/wrangler.json 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -Eq -- '-> 522|\[code: 10013\]' "$log"; then
              exit 1
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::Cloudflare deployments API kept returning transient errors after 3 attempts."
              exit 1
            fi
            echo "::warning::Transient Cloudflare deploy error on attempt $attempt/3; retrying."
            sleep "$((attempt * 10))"
          done

      - name: Publish Liin Adventure IA
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: >-
          npx tsx scripts/adventure-io.ts import
          --file=adventures/liin-adventure-ia.json
          --target=https://lindocara.alepha.dev
          --username=liinreleasebot
          --allow-remote=true
          --allow-production=true
          --replace-if-different=true

      # « La Baie des Cent Voiles » n'a PAS d'étape ici, volontairement. Elle est publiée à la main
      # sous le compte `baieauthor`, dont le mot de passe n'est pas celui de `secrets.SEED_PASSWORD`
      # (le pas de publication échouait en 401). Deux façons de l'automatiser, au choix : aligner le
      # mot de passe de `baieauthor` sur le secret, ou supprimer d'abord l'aventure existante et
      # laisser la CI enregistrer un compte robot dédié — `--replace-if-different` ne peut pas
      # remplacer une aventure dont il n'est pas l'auteur, la suppression restant réservée à celui-ci.
