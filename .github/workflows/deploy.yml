name: Deploy

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without pushing an empty commit.
  workflow_dispatch:

concurrency:
  # Never let two deploys race for the same instance.
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Nothing reaches the server without passing exactly the checks CI runs on a PR.
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    name: deploy to Bay
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lc.alepha.dev
    env:
      # Bay is reached over SSH and nothing else — there is no admin panel and no
      # inbound control port. `alepha platform` drives this runner's own `ssh`
      # binary against Bay's unix control socket on the far side.
      #
      # `BAY_HOST` is set here rather than read from `apps/main/alepha.config.ts`
      # because that file names `ovh-bay`, a `~/.ssh/config` alias that exists on
      # the author's laptop and nowhere else. A runner has no such file, so the
      # alias would not resolve. The adapter prefers `$BAY_HOST` over the config
      # for exactly this case.
      BAY_HOST: ${{ vars.BAY_HOST }}
    steps:
      - uses: actions/checkout@v5

      # Node + corepack + `yarn install --immutable`. Corepack matters beyond the install
      # here: `alepha platform up` composes its own build invocation from the package
      # manager it detects, so it shells out to `yarn alepha build` on this runner.
      - name: Setup
        uses: ./.github/actions/setup

      # The deploy key and the host's public keys. Both are required:
      #
      # - without the key the runner cannot authenticate at all;
      # - without `known_hosts` ssh refuses the connection on host-key
      #   verification. `StrictHostKeyChecking=no` would also "work", and would
      #   mean this runner hands its deploy key to whatever answers on that
      #   address. Pinning the host key is the whole point.
      #
      # Written with `printf`, not `echo`: the key is multi-line and must keep
      # its trailing newline, or ssh rejects it as malformed.
      - name: Configure SSH
        env:
          BAY_SSH_KEY: ${{ secrets.BAY_SSH_KEY }}
          BAY_KNOWN_HOSTS: ${{ secrets.BAY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BAY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$BAY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # `alepha platform up` is the whole pipeline: build (`--target=bare`,
      # because a workerd bundle has no node-runnable entry and Bay refuses it),
      # pack the artifact with its migrations, stage the app's declared secrets
      # to a 0600 file on the host, hand `bay deploy` both, and WAIT — the step
      # stays red until the release is serving or has reported why it failed.
      #
      # Migrations run at app boot, not from here.
      #
      # Secrets: every key the app declares via `$env` is collected from
      # `.env.production` if present and otherwise from this job's environment,
      # which is why they are listed below. `APP_SECRET` is deliberately absent —
      # it is Bay-owned (`bayOwnedKeys`), generated and preserved per instance,
      # and Bay refuses to let a caller overwrite it.
      - name: Deploy to Bay
        env:
          # An undefined repository variable expands to the empty string. `$env` can coerce the
          # explicit values below, but an empty string is neither a boolean nor an integer and
          # prevents Alepha from booting before the deploy even starts.
          CHEATS_ENABLED: ${{ vars.CHEATS_ENABLED || 'false' }}
          NAVIGATION_DEBUG: ${{ vars.NAVIGATION_DEBUG || 'false' }}
          WEBSOCKET_MAX_PAYLOAD: ${{ vars.WEBSOCKET_MAX_PAYLOAD || '16384' }}
          # The app's Lore sigil (project Lindocara, enrolled as `main`). It has to be listed
          # here to reach production at all: the secret collection above prefers
          # `apps/main/.env.production`, and that file is gitignored, so it does not exist on a
          # runner — a key living only there ships from a laptop and never from CI.
          #
          # No `|| ''` fallback, unlike the three above: `SIGIL_KEY` is `z.text({ default: "" })`
          # and an empty string is its documented "absent" state — the app captures locally and
          # sends nothing, which is exactly the behaviour before this line existed. The neighbours
          # need their fallbacks because an empty string is neither a boolean nor an integer and
          # would stop Alepha booting; a text key has no such edge.
          SIGIL_KEY: ${{ secrets.SIGIL_KEY }}
          # What that key is allowed to report, and into which project. Sigil used to FETCH this
          # from the sink at render time; it now reads it here, because the fetch was a round trip
          # in front of the first byte of every cold page and, on a prerendered build, an answer
          # baked into the HTML that only a redeploy could change.
          #
          # A literal, not a secret: every field is public already — the project slug and the sink
          # origin are both in the feedback URL the module renders into the page, and the switches
          # only describe what the app collects, which it announces by collecting it. `SIGIL_KEY`
          # is the thing that authorizes anything, and it stays above. Writing it inline is also
          # what makes it greppable; a repository variable would hide the app's telemetry posture
          # from the file that deploys it.
          #
          # `analytics` and `vitals` are off because the `main` sigil is enrolled for
          # `feedback` and `blights` only — the sink drops the rest anyway (`gatesFor`), so
          # sending them would be round trips for envelopes that die on arrival. This mirrors what
          # the sink used to hand back: `{views: false, errors: true, vitals: false}`. `blights`,
          # `feedback`, the button's bottom-right corner and the public `sink` all stay at their
          # defaults, which is what production already served.
          #
          # Turning collection off in a hurry is editing this line and redeploying, or setting the
          # variable on the Bay host directly — no CI run required for the second.
          SIGIL_CONFIG: '{"project":"lindocara","analytics":false,"vitals":false}'
          # The accounts that hold the `admin` role, reconciled at boot by `AdminRoleProvider`.
          # Listed here for the same reason as `SIGIL_KEY`: the collection above prefers
          # `apps/main/.env.production`, which is gitignored and therefore absent on a runner, so a
          # key living only there would ship from a laptop and never from CI.
          #
          # No `|| ''` fallback: the schema defaults it to `""`, and empty is its documented
          # "do nothing at all" state — no grants AND no revocations. That is the safe default, so
          # an unset secret degrades to inert rather than to a mass demotion.
          ADMIN_USERNAMES: ${{ secrets.ADMIN_USERNAMES }}
        run: yarn workspace @lindocara/main run deploy

  # The HD-2D witness, deployed beside the game as a SITE rather than a service:
  # `target: "static"` produces files and a manifest declaring `runtime: "static"`, and Bay
  # hosts it with no process behind it — no port, no .env, no database, no health probe.
  # It therefore has no secrets step at all: Bay refuses `--secrets-file` on a static site,
  # because there is no process to read them and no `.env` to put them in.
  #
  # Its own job rather than a second step in `deploy`, because the two apps are independent:
  # a failed game deploy should not withhold the lab, and neither should wait on the other.
  # Both still hang off `check`, so nothing ships without the same suite a PR runs.
  deploy-lab:
    if: github.ref == 'refs/heads/main'
    needs: check
    name: deploy the lab to Bay
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lindocara-lab.bay.alepha.dev
    env:
      BAY_HOST: ${{ vars.BAY_HOST }}
    steps:
      - uses: actions/checkout@v5

      # Node + corepack + `yarn install --immutable`. Corepack matters beyond the install
      # here: `alepha platform up` composes its own build invocation from the package
      # manager it detects, so it shells out to `yarn alepha build` on this runner.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure SSH
        env:
          BAY_SSH_KEY: ${{ secrets.BAY_SSH_KEY }}
          BAY_KNOWN_HOSTS: ${{ secrets.BAY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BAY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$BAY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # `yarn workspace @lindocara/lab run deploy` is two halves: `vite build` fills `dist-client/`,
      # then `alepha platform up` builds the static artifact around it, packs, uploads and waits
      # for the release to serve. The vite half has to run FIRST and outside `dist/` — the alepha
      # build cleans `dist/` before any task runs, so a client written there would be deleted
      # before the static target could adopt it.
      - name: Deploy the lab to Bay
        run: yarn workspace @lindocara/lab run deploy

      # « La Baie des Cent Voiles » n'a PAS d'étape ici, volontairement. Elle est publiée à la main
      # sous le compte `baieauthor`, dont le mot de passe n'est pas celui de `secrets.SEED_PASSWORD`
      # (le pas de publication échouait en 401). Deux façons de l'automatiser, au choix : aligner le
      # mot de passe de `baieauthor` sur le secret, ou supprimer d'abord l'aventure existante et
      # laisser la CI enregistrer un compte robot dédié — `--replace-if-different` ne peut pas
      # remplacer une aventure dont il n'est pas l'auteur, la suppression restant réservée à celui-ci.
