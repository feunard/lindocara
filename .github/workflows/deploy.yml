name: Deploy

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without pushing an empty commit.
  workflow_dispatch:

concurrency:
  # Never let two deploys race for the same instance.
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Nothing reaches the server without passing exactly the checks CI runs on a PR.
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    name: deploy to Bay
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lindocara.bay.alepha.dev
    env:
      # A key issued from bay-admin, tied to a user with the `admin` role. The
      # adapter prefers `$BAY_API_KEY` over the stored credential precisely so
      # CI needs no login and no file — a device flow wants a human, and there
      # is nobody at the keyboard here.
      BAY_API_KEY: ${{ secrets.BAY_API_KEY }}
      # Alepha's SecretProvider requires this in production and throws on the
      # dev default — that's the guarantee we want. Pushed to the instance's
      # `.env` by `platform up`, which sends exactly the variables the manifest
      # allowlists.
      APP_SECRET: ${{ secrets.APP_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `alepha platform up` is the whole pipeline: build (`--target=bare`,
      # because a workerd bundle has no node-runnable entry and Bay refuses
      # it), pack the artifact with its migrations, upload it to bay-admin, and
      # push the allowlisted `$env` values.
      #
      # Bay's own control API is a unix socket and nothing else, so bay-admin
      # over HTTPS is the only way in from a runner — that indirection is what
      # makes a CI deploy possible without exposing a root-equivalent port.
      #
      # Migrations run at app boot, not from here.
      - name: Deploy to Bay
        run: npm run deploy -w @lindocara/main

      # « La Baie des Cent Voiles » n'a PAS d'étape ici, volontairement. Elle est publiée à la main
      # sous le compte `baieauthor`, dont le mot de passe n'est pas celui de `secrets.SEED_PASSWORD`
      # (le pas de publication échouait en 401). Deux façons de l'automatiser, au choix : aligner le
      # mot de passe de `baieauthor` sur le secret, ou supprimer d'abord l'aventure existante et
      # laisser la CI enregistrer un compte robot dédié — `--replace-if-different` ne peut pas
      # remplacer une aventure dont il n'est pas l'auteur, la suppression restant réservée à celui-ci.
