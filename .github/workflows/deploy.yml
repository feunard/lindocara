name: Deploy

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without pushing an empty commit.
  workflow_dispatch:

concurrency:
  # Never let two deploys race for the same instance.
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Nothing reaches the server without passing exactly the checks CI runs on a PR.
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    name: deploy to Bay
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lindocara.bay.alepha.dev
    env:
      # A Lore API key (`alepha/api/keys`), minted under a robot account that is
      # a member of the Lindocara campaign and nothing else. A key carries its
      # owner's powers in Lore, so minting it under a human account would hand
      # this runner everything that human can do.
      #
      # A key rather than the device flow because a device flow wants a human,
      # and there is nobody at the keyboard here.
      LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
      #
      # `APP_SECRET` is deliberately absent. It is a Bay-owned variable
      # (`bayOwnedKeys` in apps/bay/internal/deploy/deploy.go): Bay generates
      # and manages it, and the user-owned keys already in the instance's `.env`
      # survive every redeploy. Passing it from here entertained the illusion
      # that CI pushes secrets — it never did.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `alepha platform up` is the whole pipeline: build (`--target=bare`,
      # because a workerd bundle has no node-runnable entry and Bay refuses
      # it), pack the artifact with its migrations, upload it to Lore, register
      # a release, and then WAIT — the step stays red until the machine reports
      # the release serving, or reports why it failed.
      #
      # Bay's control API is a unix socket and nothing else, and stays that way.
      # Nothing here reaches the host: the machine hosting this app polls Lore
      # on its own outbound channel and pulls the artifact when it sees one.
      #
      # Migrations run at app boot, not from here.
      - name: Deploy to Bay
        run: npm run deploy -w @lindocara/main

  # The HD-2D witness, deployed beside the game as a SITE rather than a service:
  # `target: "static"` produces files and a manifest declaring `runtime: "static"`, and Bay
  # hosts it with no process behind it — no port, no .env, no database, no health probe.
  #
  # Its own job rather than a second step in `deploy`, because the two apps are independent:
  # a failed game deploy should not withhold the lab, and neither should wait on the other.
  # Both still hang off `check`, so nothing ships without the same suite a PR runs.
  #
  # Same `LORE_API_KEY` — a Lore key is scoped to its owner's projects, and both apps live in
  # the same Lindocara project (63), keyed apart by app name and environment.
  deploy-lab:
    if: github.ref == 'refs/heads/main'
    needs: check
    name: deploy the lab to Bay
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lindocara-lab.bay.alepha.dev
    env:
      LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run deploy -w @lindocara/lab` is two halves: `vite build` fills `dist-client/`,
      # then `alepha platform up` builds the static artifact around it, packs, uploads and waits
      # for the release to serve. The vite half has to run FIRST and outside `dist/` — the alepha
      # build cleans `dist/` before any task runs, so a client written there would be deleted
      # before the static target could adopt it.
      - name: Deploy the lab to Bay
        run: npm run deploy -w @lindocara/lab

      # « La Baie des Cent Voiles » n'a PAS d'étape ici, volontairement. Elle est publiée à la main
      # sous le compte `baieauthor`, dont le mot de passe n'est pas celui de `secrets.SEED_PASSWORD`
      # (le pas de publication échouait en 401). Deux façons de l'automatiser, au choix : aligner le
      # mot de passe de `baieauthor` sur le secret, ou supprimer d'abord l'aventure existante et
      # laisser la CI enregistrer un compte robot dédié — `--replace-if-different` ne peut pas
      # remplacer une aventure dont il n'est pas l'auteur, la suppression restant réservée à celui-ci.
