name: CI

on:
  pull_request:
  # Let the deploy workflow reuse this exact job rather than duplicating the steps.
  # Pushes to main are covered that way, so there is no `push` trigger here: two runs of
  # the same checks on the same ref would land in the same concurrency group and cancel
  # each other.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: generated assets, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      # `yarn check` bundles the steps below; CI runs them one by one so a failure names
      # itself in the job graph instead of hiding behind a single "check" step.
      - name: Catalogue up to date
        run: yarn catalog:check

      - name: Maps up to date
        run: yarn map:check

      - name: Music catalogue up to date
        run: yarn music:check

      # Two commands, because `yarn lint` is `alepha lint` is `biome check --fix`: it REWRITES a
      # badly formatted file and then exits 0, so on its own it would wave through exactly the PR
      # it exists to stop. The diff is what restores the gate — on a runner the tree is pristine,
      # so anything biome changed here is a fix the author owed. `git diff --exit-code` is CI-only
      # for that same reason: locally it would fire on any work in progress.
      - name: Lint
        run: |
          yarn lint
          git diff --exit-code || {
            echo "::error::biome fixed files that should have been committed already — run 'yarn lint' locally and commit the result."
            exit 1
          }

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      # `--target bare` is what Bay runs: plain Node, the framework's own
      # websocket server, SQLite on disk. The root `build` script is itself
      # `yarn workspace @lindocara/main run build`, so passing the flag through it would
      # hand it to that inner `yarn run` rather than to `alepha build` — call the
      # workspace script directly.
      #
      # A build here and a build in the deploy job is deliberate duplication:
      # this one proves a PR compiles, that one is what actually ships, and
      # `platform up` refuses to deploy something it did not build itself.
      - name: Build
        run: yarn workspace @lindocara/main run build --target bare

      # A compiled artifact is not a working one. This boots the thing the step above just
      # produced — production mode, real migrations, a throwaway SQLite file — and asserts the API
      # answers, the shell is served, an unadmitted `/ws/world` dial is refused by the room and
      # SIGTERM stops the process. It runs against the `--target bare` output on purpose: that is
      # the shape Bay runs, so this is the last gate before a deploy that would otherwise only
      # discover a failed `ready()` hook in production.
      - name: Boot smoke
        run: yarn smoke

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lindocara-build
          path: apps/main/dist
          if-no-files-found: error
