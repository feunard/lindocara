<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Priest motion studio</title>
<style>
body{margin:0;background:#17242b;color:#e1e4de;font:14px system-ui}main{max-width:1180px;margin:24px auto;padding:0 24px}h1{font-size:24px}p{color:#afc2c3;line-height:1.5}label{display:inline-flex;align-items:center;gap:8px;margin:8px 20px 8px 0}button,select,input{font:inherit}button,select{color:inherit;background:#30424b;border:1px solid #5a7079;padding:8px;border-radius:4px}canvas{image-rendering:pixelated;background:#344b45;border:1px solid #526b65;max-width:100%}#views{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}#views canvas{width:100%;height:auto}.meta{font:12px monospace;white-space:pre-wrap}.small{font-size:12px}#stage{width:768px;height:256px}a{color:#e0ba79}
</style></head><body><main><h1>Dawn sanctuary · motion studio</h1>
<p>One articulated character, eight cameras. Review at game scale first; enlarge to inspect contacts. Space pauses, arrows step frames.</p>
<label>Action <select id="action"></select></label><label>Playback <input id="speed" type="range" min="0.1" max="2" value="1" step="0.05"><output id="speed-label">1×</output></label>
<button id="pause">Pause</button><button id="step">Next frame</button><label><input id="overlay" type="checkbox">Anchor / joints</label>
<label><input id="ghost" type="checkbox">Previous-frame overlay</label>
<label><input id="skeleton" type="checkbox">Motion without artwork</label>
<div><canvas id="stage" width="768" height="256"></canvas></div><p class="small">Ground scroll matches 3.65625 tiles/s at 1×. The red marker is the fixed origin, not the changing silhouette bounds.</p>
<div id="views"></div><p id="meta" class="meta"></p>
</main><script type="module" src="./viewer.mjs"></script></body></html>
