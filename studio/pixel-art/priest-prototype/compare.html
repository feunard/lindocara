<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Prêtre / Assassin V2 — comparaison du mouvement</title>
<style>
body{margin:20px;background:#202b2d;color:#e8e6df;font:14px system-ui}label{display:inline-block;margin:5px 12px 5px 0}button,select,input{font:inherit;padding:5px}canvas{display:block;max-width:100%;background:#344647;image-rendering:pixelated}a{color:#9dd7ee}pre{white-space:pre-wrap}
</style>
<h1>Comparaison du mouvement</h1>
<p>Prêtre à gauche, Assassin V2 à droite, dans chaque direction. Taille du jeu puis agrandissement. Les points au sol suivent la distance de chaque personnage.</p>
<label>Prêtre <select id="priest"></select></label><label>Assassin <select id="rogue"></select></label>
<label>Lecture <select id="rate"><option>.25</option><option>.5</option><option selected>1</option></select>×</label>
<label><input id="phase" type="checkbox">Même phase de cycle</label>
<label><input id="onion" type="checkbox">Image précédente</label>
<button id="pause">Pause</button><label>Phase <input id="scrub" type="range" min="0" max="1" step="0.002" value="0"></label>
<canvas id="comparison" width="1600" height="880"></canvas><pre id="stats"></pre>
<a href="./">Atelier détaillé du Prêtre</a> · <a href="http://localhost:5273/?preview=priest">Caméra du jeu</a>
