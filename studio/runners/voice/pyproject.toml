[project]
name = "studio-runner-voice"
version = "0"
description = "CUDA voice lane — Kokoro for stock voices, Qwen3-TTS for cloning"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.9",
    "kokoro>=0.9.4",
    "qwen-tts",
    "soundfile>=0.12",
    "numpy>=1.26",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
qwen-tts = { git = "https://github.com/QwenLM/Qwen3-TTS" }
